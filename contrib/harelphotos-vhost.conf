# An Apache virtual host for harelphotos.
#
# Drop into /etc/httpd/conf.d/ on an httpd that is already running other
# sites; it adds a vhost and touches nothing global.
#
# Valid both before and after certbot has run: the TLS vhost below is guarded
# by <IfFile>, so it is inert until the certificate exists and then switches
# itself on at the next reload. Nothing here needs commenting out.
#
# Replace photos.example.org and /var/lib/harelphotos throughout, then:
#
#     sudo mkdir -p /var/www/harelphotos-acme
#     sudo apachectl configtest && sudo systemctl reload httpd
#     sudo certbot certonly --webroot -w /var/www/harelphotos-acme -d photos.example.org
#     sudo systemctl reload httpd
#
# Use `certbot certonly` as above rather than `certbot --apache`: this file
# already contains the TLS vhost, and letting certbot write a second one for
# the same name produces two, with a warning and whichever it picks first.

<VirtualHost *:80>
    ServerName photos.example.org

    # Serves the ACME challenge, for the first certificate and every renewal.
    DocumentRoot /var/www/harelphotos-acme

    # Everything else goes to TLS -- but only once there is a certificate to
    # go to, or the site would be an infinite redirect until certbot runs.
    <IfFile /etc/letsencrypt/live/photos.example.org/fullchain.pem>
        RedirectMatch permanent "^/(?!\.well-known/)(.*)" \
            "https://photos.example.org/$1"
    </IfFile>
</VirtualHost>


<IfFile /etc/letsencrypt/live/photos.example.org/fullchain.pem>
<VirtualHost *:443>
    ServerName photos.example.org

    # HTTP/2, which is the single biggest thing you can do for an album page.
    #
    # Measured against a real server a country away: one round trip is about
    # 105 ms, and a thumbnail's first byte arrives 117 ms after the request on
    # a connection that is already open -- so the server itself costs about ten
    # milliseconds and the distance costs the rest. Over HTTP/1.1 a browser
    # opens six connections, pays a TCP and TLS handshake on each, and then
    # fetches an album's hundred-odd thumbnails six at a time: roughly
    # seventeen serialized round trips, close to two seconds of waiting before
    # a byte of most of them.
    #
    # HTTP/2 multiplexes all of them onto one connection: one handshake, and
    # the requests go out together. Nothing else on this list comes close, and
    # it is one line.
    #
    # Needs mod_http2 (`dnf install mod_http2` on Rocky). Guarded so the file
    # still loads without it, rather than refusing to start the whole server.
    <IfModule mod_http2.c>
        Protocols h2 http/1.1
    </IfModule>

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/photos.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/photos.example.org/privkey.pem
    # certbot writes this; it holds the protocol and cipher settings.
    <IfFile /etc/letsencrypt/options-ssl-apache.conf>
        Include /etc/letsencrypt/options-ssl-apache.conf
    </IfFile>

    ErrorLog  /var/log/httpd/harelphotos_error.log
    CustomLog /var/log/httpd/harelphotos_access.log combined

    # ------------------------------------------------------------ the proxy
    #
    # ProxyPreserveHost, plus X-Forwarded-Proto, is what lets the application
    # know its real name and that the connection was encrypted. It also needs
    # `behind_proxy = true` in config.toml before it will believe them.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:8099/ retry=0
    ProxyPassReverse / http://127.0.0.1:8099/

    # ------------------------------------------------------------ transfer
    #
    # HTML only. Images are AVIF, already compressed; gzipping them again just
    # burns CPU. An album page compresses about 30x, which is the whole
    # difference on a slow uplink.
    # Guarded on mod_filter, not mod_deflate: AddOutputFilterByType is
    # mod_filter's directive, and guarding on the wrong one makes configtest
    # fail on a server that has the compressor but not the filter framework.
    <IfModule mod_filter.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript
    </IfModule>

    # ------------------------------------------------------------- headers
    #
    # The application sets its own Cache-Control, Vary and Referrer-Policy;
    # this is the one Apache is better placed to add.
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"

        # HSTS. Optional, and a one-way door for max-age: if the certificate
        # later breaks, the site is unreachable for everyone and nobody can
        # click through the warning, because HSTS removes that escape hatch.
        #
        # What it actually buys here is narrow but real. The redirect above
        # already sends http to https, and the session cookie is Secure, so a
        # session cannot be stolen over plain HTTP. The remaining gap is the
        # very first request on a hostile network: an attacker can intercept
        # it and serve a convincing fake login page to capture a password.
        #
        # So: ramp, do not start at two years. 300 seconds first, leave it
        # through at least one certbot renewal, then raise it.
        #Header always set Strict-Transport-Security "max-age=300"
        #Header always set Strict-Transport-Security "max-age=31536000"
    </IfModule>
</VirtualHost>
</IfFile>
