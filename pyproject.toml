[project]
name = "harelphotos"
version = "0.1.0"
description = "A self-hosted photo gallery over an ordinary directory tree of JPEGs"
requires-python = ">=3.11"          # tomllib in the stdlib; see DESIGN.md 3.1
dependencies = [
    "Flask",                        # web framework, Jinja2, Werkzeug password hashing
    "Pillow>=11.3",                 # decode, resize, AVIF encode, EXIF
    "requests",                     # Google OAuth token exchange
    "gunicorn",                     # WSGI server behind Apache
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
harelphotos = "harelphotos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harelphotos*"]

[tool.setuptools.package-data]
harelphotos = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
